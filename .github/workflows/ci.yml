name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      # Fixtures only: CI never reaches an upstream data source, so a service
      # being down or re-released can't turn into a red build.
      - run: pytest -q
